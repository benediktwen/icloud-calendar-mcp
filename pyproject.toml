[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "icloud-calendar-mcp"
version = "0.1.0"
description = "MCP server for Apple iCloud Calendar via CalDAV"
requires-python = ">=3.10"
dependencies = [
    "mcp==1.29.0",  # pinned to deployed version; 2.x renames mcp.server.fastmcp
    "starlette>=1.0.1",
    "caldav==3.2.1",  # pinned to deployed version
    "icalendar==7.2.2",  # pinned to deployed version
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "anyio>=4.0.0",
]

[project.scripts]
icloud-calendar-mcp = "icloud_calendar_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/icloud_calendar_mcp"]